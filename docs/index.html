<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Matrix Factorization + BPR movie recommender trained on MovieLens-1M.">
<title>BPR Movie Recommender</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: film-tracker app — centred pill nav floating over a cinematic hero, glass detail card, rounded panel of shelves below. */
:root{
  --bg:#060608; --panel:#0e0e12; --card:#15151b; --line:#242430; --glass:#101016cc;
  --fg:#f4f4f7; --dim:#a0a0ae; --faint:#6b6b7a;
  --accent:#e5162a; --accent-2:#ff5265; --gold:#f5b324;
  --ui:'Inter',system-ui,sans-serif; --poster:'Oswald',Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{max-width:1320px;margin:0 auto}

/* ---------- top bar ---------- */
.topbar{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding-block:16px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--poster);font-size:19px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.logo i{width:9px;height:9px;border-radius:50%;background:var(--accent);font-style:normal;flex:none}
.pillnav{margin:0 auto;display:flex;gap:2px;background:#ffffff14;backdrop-filter:blur(14px);
  border:1px solid #ffffff1f;border-radius:999px;padding:4px}
.pillnav button{padding:8px 18px;border-radius:999px;font-size:13.5px;font-weight:500;color:#d6d6e0;
  transition:background .15s,color .15s;white-space:nowrap}
.pillnav button:hover{color:#fff}
.pillnav button[aria-current=true]{background:#ffffff;color:#111;font-weight:600}
.avbtn{display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff1f;
  backdrop-filter:blur(14px);border-radius:999px;padding:5px 13px 5px 6px;font-size:13px;white-space:nowrap}
.avbtn .av{width:25px;height:25px;border-radius:50%;background:linear-gradient(140deg,var(--accent-2),#7c1d2a);
  display:grid;place-items:center;font-size:11px;font-weight:700}
@media(max-width:720px){.logo span{display:none}.pillnav button{padding:8px 13px;font-size:12.5px}.avbtn em{display:none}}
@media(max-width:700px){.topbar{flex-wrap:wrap;gap:10px}
  .pillnav{margin:0;order:3;width:100%;justify-content:center}
  .lang{margin-inline-start:auto}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;min-height:620px;display:flex;flex-direction:column}
.hero canvas.bg{position:absolute;inset:-9% -6%;width:112%;height:118%;object-fit:cover;
  filter:blur(26px) saturate(1.3) brightness(.78)}
.scrim{position:absolute;inset:0;background:
  linear-gradient(180deg,#060608cc 0%,#06060861 24%,#06060899 60%,var(--bg) 97%),
  radial-gradient(120% 70% at 50% 0%,transparent 40%,#060608 100%)}
.heroin{position:relative;flex:1;display:flex;align-items:flex-end;padding-block:28px 34px}

.detail{display:grid;grid-template-columns:168px minmax(0,1fr) 186px;gap:22px;width:100%;
  background:var(--glass);backdrop-filter:blur(22px);border:1px solid #ffffff1a;
  border-radius:20px;padding:20px;box-shadow:0 26px 70px #000000a6}
@media(max-width:940px){.detail{grid-template-columns:132px minmax(0,1fr)}.side{grid-column:1/-1}}
@media(max-width:560px){.detail{grid-template-columns:minmax(0,1fr);gap:16px}.poster{max-width:150px}}

.poster{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;border:1px solid #ffffff1f;
  box-shadow:0 12px 34px #0009}
.poster canvas{width:100%;height:100%;display:block}
.plock{position:absolute;inset:auto 11px 12px 11px;direction:ltr;font-family:var(--poster);text-transform:uppercase;
  font-weight:600;font-size:16px;line-height:1.03;text-shadow:0 2px 14px #000d}

.info{min-width:0;display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent-2);font-weight:600;margin-bottom:9px}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--accent);font-style:normal}
.info h1{font-family:var(--poster);font-weight:700;text-transform:uppercase;letter-spacing:.005em;
  font-size:clamp(28px,4.6vw,50px);line-height:.98;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:11px;font-size:13px;color:var(--dim)}
.meta b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:3px;height:3px;border-radius:50%;background:var(--faint);flex:none}
.why{margin:12px 0 0;font-size:14px;color:#c4c4d2;line-height:1.6;max-width:58ch}
.why b{color:var(--fg);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:#ffffff14;border:1px solid #ffffff1c;border-radius:999px;padding:5px 12px;font-size:12px;color:#d2d2de}

.side{display:flex;flex-direction:column;gap:10px;justify-content:center}
.score{background:#ffffff0f;border:1px solid #ffffff1a;border-radius:13px;padding:13px;text-align:center}
.score b{display:block;font-family:var(--poster);font-size:34px;font-weight:600;color:var(--gold);
  line-height:1;font-variant-numeric:tabular-nums}
.score .stars{color:var(--gold);font-size:12px;letter-spacing:2px;margin-top:6px}
.score span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:7px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:11px;
  font-size:13.5px;font-weight:600;width:100%}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;flex:none}
.btn.p{background:var(--fg);color:#111}
.btn.p:hover{background:#fff}
.btn.p.on{background:var(--accent);color:#fff}
.btn.s{background:#ffffff14;border:1px solid #ffffff1f;color:var(--fg)}
.btn.s:hover{background:#ffffff26}

/* ---------- picks strip ---------- */
.strip{position:relative;z-index:4;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding-block:14px 0;font-size:12.5px;color:var(--faint)}
.strip button{display:inline-flex;align-items:center;gap:7px;background:#ffffff12;border:1px solid #ffffff1f;
  border-radius:999px;padding:5px 11px;font-size:12.5px;color:#d6d6e2}
.strip button:hover{background:#2a0b10;border-color:var(--accent);color:#ffc3ca}
.strip button i{font-style:normal;color:var(--faint)}

/* ---------- panel + shelves ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;margin-top:-18px;
  position:relative;z-index:3;padding:22px 0 26px}
.panel .gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.shelf+.shelf{margin-top:26px}
.shelf h2{font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.shelf h2 span{color:var(--faint);font-weight:400;font-size:12.5px}
.track{display:flex;gap:13px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:10px;
  scrollbar-width:thin;scrollbar-color:#2f2f3c transparent}
.track::-webkit-scrollbar{height:6px}
.track::-webkit-scrollbar-thumb{background:#2f2f3c;border-radius:3px}

.card{flex:0 0 146px;scroll-snap-align:start;text-align:left;transition:transform .16s}
@media(max-width:560px){.card{flex-basis:122px}}
.card:hover{transform:translateY(-4px)}
.thumb{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--card);
  border:1px solid var(--line)}
.card:hover .thumb{border-color:#4a4a5c}
.thumb canvas{width:100%;height:100%;display:block}
.lock{position:absolute;inset:auto 9px 10px 9px;direction:ltr;font-family:var(--poster);font-weight:600;
  text-transform:uppercase;font-size:14px;line-height:1.03;text-shadow:0 2px 14px #000c;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.rk{position:absolute;inset-inline-start:7px;top:4px;font-family:var(--poster);font-size:26px;font-weight:700;line-height:1;
  text-shadow:0 2px 12px #000c;font-variant-numeric:tabular-nums}
.sc{position:absolute;inset-inline-end:7px;top:7px;background:#000000ad;backdrop-filter:blur(4px);border-radius:6px;
  padding:2px 6px;font-size:11px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.chk{position:absolute;inset:0;background:#060608cc;display:grid;place-items:center}
.chk svg{width:28px;height:28px;stroke:var(--accent-2);fill:none;stroke-width:2.6}
.cmeta{margin-top:8px;font-size:12.5px;font-weight:500;line-height:1.3;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.csub{margin-top:3px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- other views ---------- */
.view{padding-block:34px 40px}
.vh1{font-family:var(--poster);text-transform:uppercase;font-size:clamp(28px,4.4vw,42px);font-weight:700;margin:0 0 8px}
.vp{color:var(--dim);font-size:14px;line-height:1.65;max-width:62ch;margin:0}
.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:0 15px;max-width:560px;margin-top:20px}
.sbar svg{width:17px;height:17px;stroke:var(--faint);fill:none;stroke-width:1.8;flex:none}
.sbar input{flex:1;min-width:0;background:none;border:0;color:var(--fg);font:inherit;font-size:15px;padding:13px 0}
.sbar input::placeholder{color:var(--faint)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;margin-top:22px}
.sgrid .card{flex:none;width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin:24px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}
.stat b{display:block;font-family:var(--poster);font-size:27px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.prose{color:#bfbfcc;font-size:14.5px;line-height:1.75;max-width:70ch}
.prose h3{color:var(--fg);font-size:14px;font-weight:600;margin:24px 0 7px}
.prose code{background:#1b1b23;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:13px}
.vec{display:flex;align-items:flex-end;gap:2px;height:42px;margin:16px 0 6px;max-width:430px}
.vec i{flex:1;background:var(--accent);border-radius:1px;min-height:1px}
.empty{color:var(--faint);font-size:13.5px}
.out{position:absolute;inset-inline-start:7px;inset-block-start:7px;background:#1b1b24e0;backdrop-filter:blur(4px);
  border:1px solid #ffffff2b;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600;color:#c9c9d8;
  letter-spacing:.03em}
.notice{display:flex;gap:10px;align-items:flex-start;background:#1a1420;border:1px solid #3a2a46;
  border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:13px;color:#cdbfd8;line-height:1.6}
.notice b{color:#f0e4f7}
.notice svg{width:17px;height:17px;flex:none;stroke:#b98fd0;fill:none;stroke-width:2;margin-top:1px}
.tabs{display:flex;gap:6px;margin-top:18px;flex-wrap:wrap}
.tabs button{background:#ffffff0f;border:1px solid var(--line);border-radius:999px;padding:8px 16px;
  font-size:13px;color:var(--dim)}
.tabs button[aria-current=true]{background:#fff;color:#111;font-weight:600;border-color:#fff}
.lang{display:flex;background:#ffffff14;border:1px solid #ffffff1f;border-radius:999px;padding:3px;
  backdrop-filter:blur(14px)}
.lang button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#d6d6e0;white-space:nowrap}
.lang button[aria-current=true]{background:#fff;color:#111}
:root[dir=rtl]{--ui:'Cairo','Inter',system-ui,sans-serif}
:root[dir=rtl] .info h1,:root[dir=rtl] .vh1{font-family:'Cairo',sans-serif;text-transform:none;line-height:1.25}
:root[dir=rtl] .eyebrow,:root[dir=rtl] .stat span,:root[dir=rtl] .out{letter-spacing:0}
:root[dir=rtl] .logo{font-family:'Oswald',sans-serif}
.fhero{position:relative;overflow:hidden;min-height:600px;display:flex;flex-direction:column}
.fhero img.fbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.fscrim{position:absolute;inset:0;background:
  linear-gradient(180deg,#060608d9 0%,#06060845 22%,#060608b3 62%,var(--bg) 97%)}
.back{display:inline-flex;align-items:center;gap:7px;background:#ffffff14;border:1px solid #ffffff1f;
  backdrop-filter:blur(14px);border-radius:999px;padding:7px 15px;font-size:13px;font-weight:500;
  margin-top:14px;position:relative;z-index:4}
.back:hover{background:#ffffff26}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4}
:root[dir=rtl] .back svg{transform:scaleX(-1)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12.5px;color:var(--dim)}
.facts b{display:block;color:var(--fg);font-weight:600;font-size:13px;margin-top:2px}
.ov{margin:12px 0 0;font-size:13.5px;color:#c4c4d2;line-height:1.65;max-width:62ch}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:620px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;border:1px solid var(--line);display:block}
.cast{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:#2f2f3c transparent}
.cast figure{flex:0 0 92px;margin:0;text-align:center}
.cast img,.cast .noimg{width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto;display:block;
  border:1px solid var(--line);background:var(--card)}
.cast figcaption{margin-top:8px;font-size:11.5px;font-weight:600;line-height:1.3}
.cast small{display:block;color:var(--faint);font-size:10.5px;margin-top:2px;line-height:1.3}
.quick{position:absolute;inset-inline-end:7px;inset-block-end:7px;width:28px;height:28px;border-radius:50%;
  background:#060608c4;border:1px solid #ffffff38;backdrop-filter:blur(5px);display:grid;place-items:center;
  opacity:0;transition:opacity .14s,background .14s}
.card:hover .quick,.quick.on{opacity:1}
.quick.on{background:var(--accent);border-color:var(--accent)}
.quick svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.8}
footer{color:var(--faint);font-size:12.5px;line-height:1.7;padding-block:26px 34px;text-align:center}
footer a{color:var(--dim);text-decoration:none}
footer a:hover{color:var(--accent-2)}
</style>
</head>
<body>
<div id="v-home">
  <section class="hero">
    <canvas class="bg" id="herobg" width="1600" height="760" aria-hidden="true"></canvas>
    <div class="scrim"></div>
    <div class="heroin gut">
      <div class="shell" style="width:100%">
        <div class="topbar" id="bar1"></div>
        <div class="strip" id="strip" hidden></div>
        <div class="detail" style="margin-top:22px">
          <div class="poster"><canvas id="hposter" width="600" height="900"></canvas>
            <span class="plock" id="hplock"></span></div>
          <div class="info">
            <span class="eyebrow"><i></i><em id="eyebrow" style="font-style:normal"></em></span>
            <h1 id="htitle">—</h1>
            <div class="meta" id="hmeta"></div>
            <p class="why" id="hwhy"></p>
            <div class="chips" id="hchips"></div>
          </div>
          <div class="side">
            <div class="score"><b id="hscore">—</b><div class="stars" id="hstars"></div>
              <span id="hcount">—</span></div>
            <button class="btn p" id="hadd"></button>
            <button class="btn s" data-go="browse" id="hbrowse"></button>
          </div>
        </div>
      </div>
    </div>
  </section>
  <div class="gut"><div class="shell"><div class="panel"><div class="gut" id="shelves"></div></div></div></div>
</div>

<div id="v-browse" hidden>
  <div class="gut"><div class="shell">
    <div class="topbar" id="bar2"></div>
    <div class="view">
      <h2 class="vh1" id="bh1"></h2>
      <p class="vp" id="bp"></p>
      <div class="tabs" id="btabs"></div>
      <div id="bnotice"></div>
      <div class="sbar" id="sbarwrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off">
      </div>
      <div class="sgrid" id="sgrid"></div>
      <div id="recentwrap"></div>
    </div>
  </div></div>
</div>

<div id="v-model" hidden>
  <div class="gut"><div class="shell">
    <div class="topbar" id="bar3"></div>
    <div class="view">
      <h2 class="vh1" id="mh1"></h2>
      <p class="vp" id="mp"></p>
      <div class="stats" id="mstats"></div>
      <div class="prose" id="mprose"></div>
    </div>
  </div></div>
</div>

<div id="v-film" hidden>
  <section class="fhero">
    <canvas class="bg" id="fbgcv" width="1600" height="760" aria-hidden="true"></canvas>
    <div class="fscrim"></div>
    <div class="heroin gut"><div class="shell" style="width:100%">
      <div class="topbar" id="bar4"></div>
      <button class="back" id="fback"></button>
      <div class="detail" style="margin-top:18px">
        <div class="poster"><canvas id="fposter" width="600" height="900"></canvas>
          <span class="plock" id="fplock"></span></div>
        <div class="info">
          <span class="eyebrow"><i></i><em id="feyebrow" style="font-style:normal"></em></span>
          <h1 id="ftitle">—</h1>
          <div class="facts" id="ffacts"></div>
          <p class="ov" id="fov"></p>
          <div class="chips" id="fchips"></div>
        </div>
        <div class="side">
          <div class="score"><b id="fscore">—</b><div class="stars" id="fstars"></div>
            <span id="fcount">—</span></div>
          <button class="btn p" id="fadd"></button>
        </div>
      </div>
    </div></div>
  </section>
  <div class="gut"><div class="shell"><div class="panel"><div class="gut">
    <section class="shelf" id="fgal" hidden></section>
    <section class="shelf" id="fcast" hidden></section>
    <div id="fsim"></div>
  </div></div></div></div>

function seed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rnd(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let grain=null;
function makeGrain(){const c=document.createElement('canvas');c.width=c.height=110;const x=c.getContext('2d');
  const d=x.createImageData(110,110);for(let i=0;i<d.data.length;i+=4){const v=190+Math.random()*65;
  d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=15;}x.putImageData(d,0,0);return c;}
function art(cv,title,genres){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,p=pal(genres),R=rnd(seed(title));
  const g=ctx.createLinearGradient(0,0,W*.35,H);
  g.addColorStop(0,p[1]);g.addColorStop(.58,p[0]);g.addColorStop(1,'#040406');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const gx=W*(.24+R()*.54),gy=H*(.16+R()*.3),gr=Math.max(W,H)*(.42+R()*.6);
  ctx.globalCompositeOperation='lighter';
  const rg=ctx.createRadialGradient(gx,gy,0,gx,gy,gr);
  rg.addColorStop(0,p[2]);rg.addColorStop(.2,p[2]+'80');rg.addColorStop(.55,p[1]+'3d');rg.addColorStop(1,'#00000000');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  if(R()>.5){const ax=W*R(),ay=H*(.1+R()*.5),ar=Math.max(W,H)*(.25+R()*.3);
    const r2=ctx.createRadialGradient(ax,ay,0,ax,ay,ar);
    r2.addColorStop(0,p[1]+'aa');r2.addColorStop(1,'#00000000');ctx.fillStyle=r2;ctx.fillRect(0,0,W,H);}
  const rays=R()>.3?3+((R()*4)|0):0;
  for(let i=0;i<rays;i++){const a=R()*6.283,w=.03+R()*.09;
    ctx.beginPath();ctx.moveTo(gx,gy);
    ctx.lineTo(gx+Math.cos(a-w)*W*2.4,gy+Math.sin(a-w)*W*2.4);
    ctx.lineTo(gx+Math.cos(a+w)*W*2.4,gy+Math.sin(a+w)*W*2.4);
    ctx.closePath();ctx.fillStyle=p[2]+'10';ctx.fill();}
  if(R()>.42){const cr=Math.min(W,H)*(.13+R()*.2);ctx.beginPath();ctx.arc(gx,gy,cr,0,7);
    ctx.fillStyle=p[2]+'26';ctx.fill();ctx.lineWidth=Math.min(W,H)*.012;ctx.strokeStyle=p[2]+'96';ctx.stroke();}
  ctx.globalCompositeOperation='source-over';
  const style=R();
  for(let L=0;L<3;L++){
    const base=H*(.6+L*.15),amp=H*(.24-L*.055),dark=['#000000','#04050a','#090a10'][L];
    ctx.beginPath();ctx.moveTo(-10,H+10);ctx.lineTo(-10,base);
    if(style<.38){for(let x=-10;x<=W+10;x+=W/9)ctx.lineTo(x,base-amp*R());}
    else if(style<.72){let x=-10;while(x<W+10){const w=W*(.04+R()*.1),h=amp*(.3+R()*1.2);
      ctx.lineTo(x,base-h);ctx.lineTo(x+w,base-h);x+=w;ctx.lineTo(x,base);}}
    else{for(let x=-10;x<=W+10;x+=W/36)ctx.lineTo(x,base-amp*(.5+.5*Math.sin(x/W*6+L*2+R()*.5)));}
    ctx.lineTo(W+10,H+10);ctx.closePath();
    ctx.fillStyle=dark;ctx.globalAlpha=[.6,.8,1][L];ctx.fill();ctx.globalAlpha=1;}
  if(!grain)grain=makeGrain();
  ctx.fillStyle=ctx.createPattern(grain,'repeat');ctx.fillRect(0,0,W,H);
  const v=ctx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.8);
  v.addColorStop(0,'#00000000');v.addColorStop(1,'#000000bb');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

let tcache={};try{tcache=JSON.parse(localStorage.getItem('tmdb1m')||'{}');}catch(e){}
function qTitle(t){
  t=t.replace(/\s*\([^)]*\)\s*$/,'').trim();
  const m=t.match(/^(.*),\s(The|A|An|La|Le|Les|Il|L'|Der|Das|Die|El|Los)$/);
  if(m)t=(m[2].endsWith("'")?m[2]:m[2]+' ')+m[1];
  return t;
}
async function tmdb(i){
  const it=item(i);
  if(it.out)return{id:it.id,p:it.p,b:it.b,title:LANG==='ar'?it.ta:it.t};
  const key=it.t+'|'+it.y+'|'+LANG;
  if(key in tcache)return tcache[key];
  try{
    const r=await fetch(API+'search/movie?api_key='+TMDB_KEY+'&language='+(LANG==='ar'?'ar':'en-US')+
      '&query='+encodeURIComponent(qTitle(it.t))+'&year='+it.y);
    const j=await r.json(),h=j.results&&j.results[0];
    tcache[key]=h?{id:h.id,p:h.poster_path||null,b:h.backdrop_path||null,title:h.title||null}:null;
  }catch(e){tcache[key]=null;}
  try{localStorage.setItem('tmdb1m',JSON.stringify(tcache));}catch(e){}
  return tcache[key];
}

const TGEN={28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',
 10751:"Children's",14:'Fantasy',36:'Drama',27:'Horror',10402:'Musical',9648:'Mystery',10749:'Romance',
 878:'Sci-Fi',10770:'Drama',53:'Thriller',10752:'War',37:'Western'};
const YEARS=[2026,2025,2024,2023,2022,2021];
const EXTRA=[];
const item=i=>i<N?meta[i]:EXTRA[i-N];
const vecOf=i=>i<N?Q.subarray(i*K,(i+1)*K):EXTRA[i-N].v;
const loc={};
function disp(i){const it=item(i);
  if(it.out)return LANG==='ar'?it.ta:it.t;
  return loc[LANG+':'+i]||it.t;}
function proxy(gs){
  const set=new Set(gs),sc=[];
  for(let i=0;i<N;i++){
    const mg=meta[i].g.split('|');let inter=0;
    for(const g of mg)if(set.has(g))inter++;
    if(!inter)continue;
    sc.push([i,inter/new Set(mg.concat(gs)).size,meta[i].p]);
  }
  sc.sort((a,b)=>b[1]-a[1]||b[2]-a[2]);
  const v=new Float32Array(K);
  sc.slice(0,40).forEach(([i])=>{for(let d=0;d<K;d++)v[d]+=Q[i*K+d]/norm[i];});
  let n=0;for(let d=0;d<K;d++)n+=v[d]*v[d];n=Math.sqrt(n)||1e-9;
  for(let d=0;d<K;d++)v[d]/=n;
  return v;
}

        const am={};(ar.results||[]).forEach(m=>{am[m.id]=m.title;});
        (en.results||[]).slice(0,15).forEach(m=>{
          const g=(m.genre_ids||[]).map(x=>TGEN[x]).filter(Boolean);
          raw.push({id:m.id,t:m.title,ta:am[m.id]||m.title,y:String(y),g:(g.length?g:['Drama']).join('|'),
            r:+(m.vote_average||0).toFixed(2),n:m.vote_count||0,p:m.poster_path,b:m.backdrop_path});
        });

    try{localStorage.setItem('recent1',JSON.stringify(raw));}catch(e){}

  raw.forEach(m=>{EXTRA.push(Object.assign({out:true,v:proxy(m.g.split('|'))},m));});

const picks=[];let P=null,lastMs=0,view='home',btab='data';
const byPop=[...Array(N).keys()].sort((a,b)=>meta[b].p-meta[a].p);
const byRate=[...Array(N).keys()].filter(i=>meta[i].n>=700).sort((a,b)=>meta[b].r-meta[a].r);

function foldIn(liked){
  const p=new Float32Array(K);for(let d=0;d<K;d++)p[d]=(Math.random()-.5)*.2;
  const lr=.05,reg=.02,t0=performance.now();
  for(let ep=0;ep<400;ep++)for(const i of liked){
    const vi=vecOf(i),j=(Math.random()*N)|0;if(picks.includes(j))continue;
    let x=0;for(let d=0;d<K;d++)x+=p[d]*(vi[d]-Q[j*K+d]);
    const gg=1/(1+Math.exp(Math.max(-30,Math.min(30,x))));
    for(let d=0;d<K;d++)p[d]+=lr*(gg*(vi[d]-Q[j*K+d])-reg*p[d]);}
  lastMs=Math.round(performance.now()-t0);return p;
}
function rank(p,n){const s=new Float32Array(N);
  for(let i=0;i<N;i++){let v=0;for(let d=0;d<K;d++)v+=p[d]*Q[i*K+d];s[i]=v;}
  picks.forEach(i=>{if(i<N)s[i]=-1e9;});
  return [...Array(N).keys()].sort((a,b)=>s[b]-s[a]).slice(0,n);}
function rankExtra(p,n){
  return EXTRA.map((m,k)=>{let v=0;for(let d=0;d<K;d++)v+=p[d]*m.v[d];return [N+k,v];})
    .filter(([i])=>!picks.includes(i)).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([i])=>i);}
function near(i,n,skip){
  const vi=vecOf(i);let ni=0;for(let d=0;d<K;d++)ni+=vi[d]*vi[d];ni=Math.sqrt(ni)||1e-9;
  return [...Array(N).keys()].map(j=>{let v=0;for(let d=0;d<K;d++)v+=vi[d]*Q[j*K+d];
    return [j,v/(ni*norm[j])];}).sort((a,b)=>b[1]-a[1])
    .filter(([j])=>j!==i&&!skip.has(j)).slice(0,n).map(([j])=>j);}
const stars=r=>'★★★★★'.slice(0,Math.round(r))+'☆☆☆☆☆'.slice(0,5-Math.round(r));

    (no?'<span class="rk">'+no+'</span>':(it.out?'<span class="out">'+esc(T('outside'))+'</span>':''))+
    '<span class="sc">'+it.r.toFixed(1)+'</span>'+
    '<span class="lock">'+esc(disp(i))+'</span>'+
    (on?'<span class="chk"><svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg></span>':'')+
    '<span class="quick'+(on?' on':'')+'" role="button" tabindex="0" title="'+esc(on?T('inPicks'):T('iLiked'))+'">'+
      (on?'<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>'
         :'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>')+'</span>'+
    '</div><div class="cmeta">'+esc(disp(i))+'</div><div class="csub">'+it.y+'</div>';
  art(b.querySelector('canvas'),it.t,it.g);
  const qk=b.querySelector('.quick');
  qk.onclick=e=>{e.stopPropagation();toggle(i);};
  qk.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();toggle(i);}};
  b.onclick=()=>openFilm(i);return b;
}
function shelf(title,note,ids,ranked){
  const d=document.createElement('section');d.className='shelf';
  d.innerHTML='<h2>'+esc(title)+(note?'<span>'+esc(note)+'</span>':'')+'</h2>';
  const t=document.createElement('div');t.className='track';
  ids.forEach((i,k)=>t.appendChild(card(i,ranked?k+1:0)));
  d.appendChild(t);hookPosters(d);return d;
}
function bars(){
  const html='<div class="logo"><i></i>BPR<span>&nbsp;Recommender</span></div>'+
   '<nav class="pillnav">'+['home','browse','model'].map(v=>
     '<button data-v="'+v+'" aria-current="'+(v===view||(view==='film'&&v==='home'))+'">'+esc(T(v))+'</button>').join('')+'</nav>'+
   '<div class="lang">'+[['en','EN'],['ar','عربي']].map(([c,l])=>
     '<button data-l="'+c+'" aria-current="'+(c===LANG)+'">'+l+'</button>').join('')+'</div>'+
   '<button class="avbtn" data-go="home"><span class="av">'+(picks.length||'W')+'</span><em>'+
     esc(picks.length?T('liked')(picks.length):T('guest'))+'</em></button>';
  ['#bar1','#bar2','#bar3','#bar4'].forEach(s=>{const el=$(s);if(el)el.innerHTML=html;});
  document.querySelectorAll('.pillnav button').forEach(b=>{b.onclick=()=>show(b.dataset.v);});
  document.querySelectorAll('[data-go]').forEach(b=>{b.onclick=()=>show(b.dataset.go);});
  document.querySelectorAll('.lang button').forEach(b=>{b.onclick=()=>setLang(b.dataset.l);});
}
function hero(i,label,why){
  const it=item(i);
  art($('#herobg'),it.t,it.g);art($('#hposter'),it.t,it.g);
  const h=$('.hero');['img.bgimg','img.pimg'].forEach(s=>{const e=h.querySelector(s);if(e)e.remove();});
  $('#herobg').style.opacity='1';$('#hposter').style.opacity='1';
  $('#hplock').style.display='';$('#hplock').textContent=disp(i);
  $('#eyebrow').textContent=label;
  $('#htitle').textContent=disp(i);
  $('#hmeta').innerHTML='<b>'+it.y+'</b><span class="dot"></span>'+esc(T('ratings')(it.n))+
    '<span class="dot"></span>'+(it.out?esc(T('outside')):'MovieLens-1M');
  $('#hwhy').innerHTML=why;
  $('#hchips').innerHTML=glist(it.g).map(g=>'<span class="chip">'+esc(g)+'</span>').join('');
  $('#hscore').textContent=it.r.toFixed(2);
  $('#hstars').textContent=stars(it.r);
  $('#hcount').textContent=T('meanRating');
  const on=picks.includes(i),b=$('#hadd');
  b.className='btn p'+(on?' on':'');
  b.innerHTML=(on?'<svg viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>'
                 :'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>')+esc(on?T('inPicks'):T('iLiked'));
  b.onclick=()=>toggle(i);
  $('#hbrowse').textContent=T('browseAll');
  heroArt(i);
}
function draw(){
  document.documentElement.lang=LANG;
  document.documentElement.dir=T('dir');
  const sh=$('#shelves');sh.innerHTML='';
  if(picks.length<3){
    hero(byPop[0],T('ebPop'),T('prompt')(3-picks.length));
    sh.appendChild(shelf(T('shStart'),T('shStartN'),byPop.slice(0,20)));
    if(EXTRA.length)sh.appendChild(shelf(T('shRec'),T('shRecN'),EXTRA.slice(0,18).map((m,k)=>N+k)));
    sh.appendChild(shelf(T('shAcc'),T('shAccN'),byRate.slice(0,20)));
  }else{
    P=foldIn(picks);
    const top=rank(P,22),last=picks[picks.length-1];
    hero(top[0],T('ebTop'),T('why')(picks.length,esc(disp(last))));
    sh.appendChild(shelf(T('shTop'),T('shTopN'),top.slice(0,18),true));
    sh.appendChild(shelf(T('shBec')(disp(last)),T('shBecN'),near(last,18,new Set(picks))));
    if(EXTRA.length)sh.appendChild(shelf(T('shCold'),T('shColdN'),rankExtra(P,18)));
    sh.appendChild(shelf(T('shAcc'),T('shAccN'),byRate.slice(0,18)));
  }
  const st=$('#strip');
  st.hidden=!picks.length;
  if(picks.length){st.innerHTML='<span>'+esc(T('picks'))+'</span>';
    picks.forEach(i=>{const b=document.createElement('button');b.type='button';
      b.innerHTML='<i>×</i>'+esc(disp(i));b.onclick=()=>toggle(i);st.appendChild(b);});}
  bars();drawBrowse();drawModel();drawFoot();
}
function toggle(i){const k=picks.indexOf(i);k<0?picks.push(i):picks.splice(k,1);draw();}

function drawBrowse(){
  $('#bh1').textContent=T('bh1');$('#bp').textContent=T('bp');
  $('#q').placeholder=T('searchPh');
  $('#btabs').innerHTML=[['data',T('tabData')],['rec',T('tabRec')]].map(([c,l])=>
    '<button data-t="'+c+'" aria-current="'+(c===btab)+'">'+esc(l)+'</button>').join('');
  document.querySelectorAll('#btabs button').forEach(b=>{b.onclick=()=>{btab=b.dataset.t;drawBrowse();};});
  const isRec=btab==='rec';
  $('#bnotice').innerHTML=isRec?'<div class="notice"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg><div>'+T('notice')+'</div></div>':'';
  $('#q').placeholder=isRec?T('searchAny'):T('searchPh');
  $('#sgrid').hidden=isRec;
  $('#recentwrap').hidden=!isRec;
  if(isRec){drawRecent();}else{$('#q').value=qData;search();}
}
let qData='',qRec='',searchSeq=0;
function drawRecent(){
  const w=$('#recentwrap');w.innerHTML='';
  $('#q').value=qRec;
  if(qRec.trim()){
    const ids=EXTRA.map((m,k)=>[m,N+k]).filter(([m])=>m.__q===qRec.trim().toLowerCase()).map(([,i])=>i);
    const sec=document.createElement('section');sec.className='shelf';
    sec.innerHTML='<h2>'+esc(T('results'))+'<span>'+esc(T('resultsN'))+'</span></h2>';
    const g=document.createElement('div');g.className='sgrid';g.style.marginTop='0';
    ids.forEach(i=>g.appendChild(card(i,0)));
    if(!ids.length)g.innerHTML='<p class="empty">'+esc(T('noFilm'))+'</p>';
    sec.appendChild(g);w.appendChild(sec);hookPosters(w);
    return;
  }
  YEARS.forEach(y=>{
    const ids=EXTRA.map((m,k)=>[m,N+k]).filter(([m])=>!m.__q&&m.y===String(y)).map(([,i])=>i);
    if(ids.length)w.appendChild(shelf(String(y),T('shRecN'),ids));
  });
  if(!EXTRA.length)w.innerHTML='<p class="empty">…</p>';
}
async function searchTmdb(term){
  const t=term.trim().toLowerCase();if(!t||!TMDB_KEY)return;
  const seq=++searchSeq;
  if(EXTRA.some(m=>m.__q===t)){drawRecent();return;}
  try{
    const r=await fetch(API+'search/movie?api_key='+TMDB_KEY+'&language='+(LANG==='ar'?'ar':'en-US')+
      '&query='+encodeURIComponent(term.trim()));
    const j=await r.json();
    if(seq!==searchSeq)return;
    (j.results||[]).filter(m=>m.poster_path).slice(0,18).forEach(m=>{
      const idx=addExtra(m);EXTRA[idx-N].__q=t;});
    drawRecent();
  }catch(e){}
}
function search(){
  const term=$('#q').value.trim().toLowerCase();
  const list=(term?byPop.filter(i=>meta[i].t.toLowerCase().includes(term)):byPop).slice(0,48);
  const g=$('#sgrid');g.innerHTML='';
  if(!list.length){g.innerHTML='<p class="empty">'+esc(T('noMatch'))+'</p>';return;}
  list.forEach(i=>g.appendChild(card(i,0)));
  hookPosters(g);
}
function drawModel(){
  $('#mh1').textContent=T('mh1');$('#mp').textContent=T('mp');
  $('#mstats').innerHTML=[['2,496','stMovies'],['32','stFactors'],['0.41','stNdcg'],['223,097','stPairs']]
    .map(([v,k])=>'<div class="stat"><b>'+v+'</b><span>'+esc(T(k))+'</span></div>').join('');
  let h='';
  ['pTrain','pRank'].forEach(k=>{const [t,b]=T(k);h+='<h3>'+esc(t)+'</h3>'+b;});
  h+='<div id="vecwrap"'+(P?'':' hidden')+'><div class="vec" id="vec"></div>'+
     '<p class="vp" style="font-size:12px">'+(P?T('vecNote')(lastMs):'')+'</p></div>';
  ['pRecent','pWeak','pUi','pArt'].forEach(k=>{const [t,b]=T(k);h+='<h3>'+esc(t)+'</h3>'+b;});
  $('#mprose').innerHTML=h;
  if(P){let mx=0;for(let d=0;d<K;d++)mx=Math.max(mx,Math.abs(P[d]));
    const v=$('#vec');v.innerHTML='';
    for(let d=0;d<K;d++){const b=document.createElement('i');
      b.style.height=Math.max(2,Math.abs(P[d])/mx*42)+'px';b.style.opacity=P[d]<0?.32:.92;v.appendChild(b);}}
}
function drawFoot(){
  $('#foot').innerHTML=esc(T('foot'))+
    '<a href="https://github.com/Aiwadod/movie-recommender-bpr">github.com/Aiwadod/movie-recommender-bpr</a>'+
    (TMDB_KEY?'<br><span>'+esc(T('cred'))+'</span>':'');
}
function show(v){view=v;
  ['home','browse','model','film'].forEach(n=>{$('#v-'+n).hidden=(n!==v);});
  bars();if(v==='browse')drawBrowse();window.scrollTo(0,0);}
function setLang(l){
  if(l===LANG)return;LANG=l;
  try{localStorage.setItem('lang',l);}catch(e){}
  draw();
}
let qTimer=null;
$('#q').oninput=()=>{
  if(btab==='rec'&&view==='browse'){qRec=$('#q').value;
    clearTimeout(qTimer);qTimer=setTimeout(()=>searchTmdb(qRec),350);
    if(!qRec.trim())drawRecent();
  }else{qData=$('#q').value;search();}
};
draw();
loadRecent().then(()=>{if(EXTRA.length)draw();});
})();
</script>
</body>
</html>
